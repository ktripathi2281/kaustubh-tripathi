<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found · Kaustubh Tripathi</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F3EFE6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (_) {}
      // Scripts run, so the theme toggle can work. Diagrams draw themselves in
      // only when motion is welcome; otherwise they are simply there.
      document.documentElement.classList.add("js");
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("js-draw");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/notfound.jsx"></script>
  </body>
</html>
